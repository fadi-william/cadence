# Local development:   docker compose up -d            (Postgres + Redis)
# Full stack:          docker compose --profile app up -d --build
#                      → http://localhost:8080  (setup token is printed in `docker compose logs api`)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: cadence
      POSTGRES_DB: cadence
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cadence']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  api:
    profiles: [app]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://cadence:cadence@postgres:5432/cadence?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-}            # required: openssl rand -base64 48
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-} # required: openssl rand -base64 32
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080/api}
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}

  web:
    profiles: [app]
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    depends_on: [api]
    ports: ['8080:80']

volumes:
  pgdata:
