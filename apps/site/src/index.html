<!doctype html>
<html lang="en" data-theme="cadence">
  <head>
    <meta charset="utf-8" />
    <title>Cadence: see how your engineering teams deliver</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Cadence is an open-source, self-hosted engineering insights platform. Jira and Azure DevOps merged per person, team and tribe, plus DORA delivery metrics." />
    <meta name="theme-color" content="#5f1830" />
    <meta property="og:title" content="Cadence: engineering insights, merged per person" />
    <meta property="og:description" content="Open-source, self-hosted. Jira + Azure DevOps combined per person, team and tribe, with DORA metrics." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="screenshots/dashboard.png" />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = localStorage.getItem('cadence-site-theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'cadence-dark' : 'cadence';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
