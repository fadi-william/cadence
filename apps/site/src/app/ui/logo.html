<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 48 48"
  aria-hidden="true"
  class="shrink-0"
>
  <defs>
    <linearGradient [attr.id]="gid" x1="6" y1="4" x2="42" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9466f" />
      <stop offset="0.55" stop-color="#9b1b3c" />
      <stop offset="1" stop-color="#5c0f24" />
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="14" [attr.fill]="'url(#' + gid + ')'" />
  <rect
    x=".75"
    y=".75"
    width="46.5"
    height="46.5"
    rx="13.25"
    fill="none"
    stroke="#fff"
    stroke-opacity=".18"
    stroke-width="1.5"
  />
  <path
    d="M33.2 14.8A13 13 0 1 0 33.2 33.2"
    fill="none"
    stroke="#fff"
    stroke-width="4.6"
    stroke-linecap="round"
  />
  <rect x="17.2" y="21" width="3.4" height="8" rx="1.7" fill="#fff" opacity=".9" />
  <rect x="22.3" y="17.5" width="3.4" height="15" rx="1.7" fill="#fff" />
  <rect x="27.4" y="22.5" width="3.4" height="5" rx="1.7" fill="#fff" opacity=".8" />
  <circle cx="35.6" cy="12.4" r="3.4" fill="#f3d38d" />
</svg>
@if (wordmark()) {
  <span class="leading-none">
    <span
      class="block font-extrabold tracking-tight"
      [style.font-size.px]="size() * 0.52"
      [class]="inverse() ? 'text-white' : 'text-base-content'"
    >
      Cadence
    </span>
    @if (tagline()) {
      <span
        class="mt-1 block text-[11px] font-medium tracking-wide"
        [class]="inverse() ? 'text-white/60' : 'opacity-60'"
        >{{ tagline() }}</span
      >
    }
  </span>
}
