<nav class="mx-auto flex h-16 max-w-7xl items-center gap-2 page-gutter" aria-label="Main">
  <a routerLink="/" class="flex h-10 items-center" aria-label="Cadence home"
    ><app-logo [size]="34"
  /></a>

  <div class="ml-6 hidden items-center gap-1 md:flex">
    @for (l of links; track l.label) {
      @if (l.fragment) {
        <a
          [routerLink]="l.path"
          [fragment]="l.fragment"
          class="rounded-full px-4 py-2 text-sm font-semibold opacity-80 transition hover:bg-base-100 hover:opacity-100"
          >{{ l.label }}</a
        >
      } @else {
        <a
          [routerLink]="l.path"
          routerLinkActive="!bg-base-100 !text-primary !opacity-100"
          class="rounded-full px-4 py-2 text-sm font-semibold opacity-80 transition hover:bg-base-100 hover:opacity-100"
          >{{ l.label }}</a
        >
      }
    }
  </div>

  <div class="flex-1"></div>

  <label class="swap swap-rotate btn btn-circle btn-ghost" aria-label="Toggle dark mode">
    <input type="checkbox" [checked]="theme.isDark()" (change)="theme.toggle()" />
    <app-icon name="sun" class="swap-on" />
    <app-icon name="moon" class="swap-off" />
  </label>
  <a
    [href]="repo"
    target="_blank"
    rel="noopener"
    class="btn btn-primary hidden rounded-full sm:inline-flex"
  >
    <app-icon name="github" [size]="16" /> GitHub
  </a>

  <div class="dropdown dropdown-end md:hidden">
    <button
      tabindex="0"
      class="btn btn-circle btn-ghost"
      aria-label="Open menu"
      (click)="open.set(!open())"
    >
      <app-icon name="menu" />
    </button>
    <ul
      tabindex="0"
      class="menu dropdown-content z-50 mt-3 w-56 rounded-box border border-base-content/10 bg-base-100 p-2"
    >
      @for (l of links; track l.label) {
        <li>
          <a class="rounded-full" [routerLink]="l.path" [fragment]="l.fragment">{{ l.label }}</a>
        </li>
      }
      <li>
        <a class="rounded-full" [href]="repo" target="_blank" rel="noopener"
          ><app-icon name="github" [size]="15" /> GitHub</a
        >
      </li>
    </ul>
  </div>
</nav>
