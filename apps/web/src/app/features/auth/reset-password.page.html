<app-auth-layout tagline="A fresh start, in one step.">
  <h1 class="text-2xl font-extrabold tracking-tight">Choose a new password</h1>
  @if (!token()) {
    <div role="alert" class="alert alert-error alert-soft my-5 text-sm">
      This link is missing its token. Request a new one.
    </div>
    <a routerLink="/forgot-password" class="btn btn-primary rounded-full">Request a new link</a>
  } @else {
    <p class="mb-5 text-sm opacity-70">Use at least 12 characters. A short sentence works well.</p>
    @if (error()) {
      <div role="alert" class="alert alert-error alert-soft mb-4 text-sm">{{ error() }}</div>
    }
    <form class="flex flex-col gap-2" (submit)="onSubmit($event)" novalidate>
      <app-field label="New password" [field]="f.password">
        <label class="input w-full" [class.input-error]="invalid(f.password)">
          <app-icon name="lock" [size]="16" class="opacity-50" />
          <input
            type="password"
            placeholder="New password (min. 12 characters)"
            autocomplete="new-password"
            [formField]="f.password"
          />
        </label>
      </app-field>
      <progress
        class="progress h-1.5 w-full"
        [class]="strength().cls"
        [value]="strength().score"
        max="4"
      ></progress>
      <app-field label="Confirm password" [field]="f.confirm">
        <label class="input w-full" [class.input-error]="invalid(f.confirm)">
          <app-icon name="lock" [size]="16" class="opacity-50" />
          <input
            type="password"
            placeholder="Confirm new password"
            autocomplete="new-password"
            [formField]="f.confirm"
          />
        </label>
      </app-field>
      <button class="btn btn-primary mt-3 rounded-full" [disabled]="f().submitting()">
        Set password
      </button>
    </form>
  }
</app-auth-layout>
