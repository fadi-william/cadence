@if (rated()) {
  <div
    class="radial-progress shrink-0 bg-base-200 text-sm"
    [style.--value]="level().pct"
    [style.--size]="'4.25rem'"
    [style.--thickness]="'6px'"
    [style.color]="level().color"
    role="progressbar"
    [attr.aria-valuenow]="level().pct"
    [attr.aria-label]="label() + ' rating'"
  >
    <app-icon [name]="icon()" [size]="20" />
  </div>
} @else {
  <div class="grid size-[4.25rem] shrink-0 place-items-center rounded-full bg-base-200">
    <app-icon [name]="icon()" [size]="20" />
  </div>
}
<div class="min-w-0 flex-1">
  <div class="flex flex-wrap items-center gap-2">
    <span class="text-sm font-medium leading-tight opacity-70">{{ label() }}</span>
    @if (rated()) {
      <app-rating-badge [rating]="rating()" />
    }
  </div>
  <div class="text-2xl font-extrabold tracking-tight">{{ value() }}</div>
  @if (hint()) {
    <div class="truncate text-xs opacity-60">{{ hint() }}</div>
  }
</div>
